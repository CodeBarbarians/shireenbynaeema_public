name: Build and deploy ASP.Net Core app to Azure Web App

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # Use the SDK you need

      - name: Build with dotnet
        run: dotnet build --configuration Release
        
      - name: Clean publish folder
        run: Remove-Item -Recurse -Force ./publish -ErrorAction SilentlyContinue   # Clean BEFORE publishing
        
      - name: Publish with dotnet
        run: dotnet publish -c Release -o ./publish
        
      - name: Zip publish folder
        run: Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath "${{ github.workspace }}\publish.zip" -Force

      - name: Verify zip exists
        run: dir ${{ github.workspace }}
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: 'SERVICE_PRINCIPAL'

      - name: List publish output (debug)
        run: ls ./publish   # Optional: verify files exist

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'codebarbarians'
          package: ${{ github.workspace }}/publish.zip
